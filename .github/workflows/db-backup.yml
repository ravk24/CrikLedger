name: DB Backup (every 5 days)

on:
  schedule:
    - cron: "30 21 */5 * *" # every 5th day at 21:30 UTC = 3:00 AM IST, low-activity window
  workflow_dispatch: {} # manual "Run workflow" button for on-demand backups

jobs:
  backup:
    runs-on: ubuntu-latest
    # secrets live in the "Production" environment (not repository secrets)
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # the prune step deletes old backup artifacts
    steps:
      - name: Install postgresql-client 17 (PGDG)
        # pg_dump's major version must be >= the server's; the PGDG repo guarantees 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          # Refresh ONLY the PGDG list. The runner image ships third-party
          # sources (Google Chrome, Microsoft…) we never use, and a hash
          # mismatch on one of their mirrors failed two backups on
          # 2026-09-09 (apt-get update exit 100) before this change.
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it as an environment secret: Settings > Environments > Production (see db/BACKUP.md)."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL is not a connection URI. It must start with postgresql:// — copy the full Session pooler string (postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres), no quotes, no 'psql' prefix."
              exit 1
              ;;
          esac
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the direct connection (db.<ref>.supabase.co), which is IPv6-only — GitHub runners cannot reach it. Use the Session pooler string: same as the app's pooler URL but port 5432 (host aws-0-<region>.pooler.supabase.com)."
              exit 1
              ;;
          esac
          case "$SUPABASE_DB_URL" in
            *:6543/*)
              echo "::error::SUPABASE_DB_URL looks like the transaction pooler (port 6543), which pg_dump cannot use. Use the Session pooler string (port 5432) from Supabase Dashboard > Connect."
              exit 1
              ;;
          esac
          # full path: the runner's preinstalled client 16 otherwise shadows 17,
          # and pg_dump refuses servers newer than itself
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean --if-exists \
            -f backup.sql

      - name: Sanity-check dump
        # fail loudly rather than upload an empty/garbage dump
        run: |
          grep -q "CREATE TABLE" backup.sql
          grep -q "pool_entries" backup.sql

      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set. Add it as an environment secret: Settings > Environments > Production (see db/BACKUP.md)."
            exit 1
          fi
          gzip backup.sql
          gpg --batch --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" backup.sql.gz
          echo "BACKUP_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_DATE }}-run${{ github.run_number }}
          path: backup.sql.gz.gpg
          # Retention is by COUNT (the prune step below keeps the newest 7).
          # 90 days is only GitHub's backstop, set well past 7 × 5 days so
          # time expiry can never undercut the count.
          retention-days: 90
          if-no-files-found: error

      - name: Keep only the newest 7 backups
        # Runs only after a successful upload, so a failed dump never evicts
        # an older backup: seven good backups stay seven. Manual runs count
        # like scheduled ones — a pre-migration backup is still a backup.
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 7
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("db-backup-")) | select(.expired | not) | "\(.created_at) \(.id) \(.name)"' \
            | sort -r | tail -n +$((KEEP + 1)) \
            | while read -r created id name; do
                echo "deleting $name ($created)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              done
          echo "kept the newest $KEEP backups"
